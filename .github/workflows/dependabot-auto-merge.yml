name: Dependabot auto-merge

on:
  workflow_run:
    workflows:
      - Repository checks
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Auto-merge Dependabot PR
    if: >-
      github.repository == 'Rauberhohle-2-0/Nymeria' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge verified Dependabot PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          default_branch="${DEFAULT_BRANCH:-main}"
          pr_number="${PR_NUMBER:-}"

          if [[ -z "$pr_number" ]]; then
            pr_number=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '.[0].number // empty')
          fi

          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "No pull request is associated with this run. Nothing to do."
            exit 0
          fi

          pr_path="repos/$REPO/pulls/$pr_number"
          author=$(gh api "$pr_path" --jq '.user.login')
          pr_state=$(gh api "$pr_path" --jq '.state')
          merged=$(gh api "$pr_path" --jq '.merged')
          base_ref=$(gh api "$pr_path" --jq '.base.ref')
          head_repo=$(gh api "$pr_path" --jq '.head.repo.full_name')
          head_sha=$(gh api "$pr_path" --jq '.head.sha')

          if [[ "$author" != "dependabot[bot]" ]]; then
            echo "PR #$pr_number is authored by '$author', not Dependabot. Skipping."
            exit 0
          fi

          if [[ "$pr_state" != "open" || "$merged" != "false" ]]; then
            echo "PR #$pr_number is not open and unmerged. Skipping."
            exit 0
          fi

          if [[ "$base_ref" != "$default_branch" ]]; then
            echo "PR #$pr_number targets '$base_ref', not '$default_branch'. Skipping."
            exit 0
          fi

          if [[ "$head_repo" != "$REPO" ]]; then
            echo "PR #$pr_number does not come from this repository. Skipping."
            exit 0
          fi

          if [[ "$head_sha" != "$HEAD_SHA" ]]; then
            echo "PR #$pr_number changed after Repository checks ran. Skipping."
            exit 0
          fi

          echo "Repository checks passed for Dependabot PR #$pr_number ($HEAD_SHA)."
          gh pr merge "$pr_number" --repo "$REPO" --squash --delete-branch \
            --match-head-commit "$HEAD_SHA"
